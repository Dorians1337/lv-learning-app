<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latvian Roguelite Learning</title>
    <style>
        body {
            background-color: #131f24;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 16px 28px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            width: min(92vw, 500px);
            max-width: 500px;
            padding: 12px 0 0;
            box-sizing: border-box;
        }
        .header-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        .status-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hearts {
            color: #ff4b4b;
            font-size: 24px;
            letter-spacing: 2px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .streak-counter {
            color: #ffc800;
            font-weight: bold;
            font-size: 18px;
        }
        .streak-shop {
            background: rgba(31, 53, 64, 0.9);
            border: 1px solid rgba(132, 216, 255, 0.22);
            border-radius: 14px;
            padding: 8px 10px;
            min-width: 150px;
            box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        }
        .shop-label {
            font-size: 11px;
            color: #c9d6dc;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .shop-btn {
            width: 100%;
            padding: 9px 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(180deg, #ffc800, #f4b900);
            color: #1b1b1b;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .shop-btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }
        .shop-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .progress-bar {
            width: 100%;
            background-color: #3b4c56;
            height: 16px;
            border-radius: 8px;
            margin-bottom: 40px;
            overflow: hidden;
        }
        .progress {
            width: 0%;
            background-color: #58cc02;
            height: 100%;
            transition: width 0.3s;
        }
        .prompt {
            font-size: 20px;
            color: #afafaf;
            margin-bottom: 10px;
        }
        .word-box {
            font-size: clamp(28px, 5vw, 36px);
            font-weight: bold;
            margin-bottom: 24px;
            color: #ffffff;
        }
        .hard-badge {
            display: none;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 200, 0, 0.12);
            border: 1px solid rgba(255, 200, 0, 0.45);
            color: #ffd54a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            max-width: 90%;
        }
        .heart-progress {
            display: inline-block;
            margin: 0 auto 20px;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            color: #f4d77a;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }
        .option-btn {
            background-color: #1f3540;
            border: 2px solid #3b4c56;
            border-radius: 12px;
            color: white;
            padding: clamp(12px, 2vw, 16px);
            font-size: clamp(15px, 2.6vw, 18px);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #284250;
        }
        .option-btn.selected {
            background-color: #284250;
            border-color: #84d8ff;
        }
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
        .footer-status {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 6px 0 14px;
        }
        .btn {
            padding: clamp(12px, 2vw, 14px) clamp(16px, 4vw, 28px);
            border-radius: 12px;
            font-size: clamp(14px, 2.6vw, 16px);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .skip-btn {
            background-color: transparent;
            color: #afafaf;
        }
        .skip-btn:disabled {
            background-color: rgba(59, 76, 86, 0.4);
            color: #7f8c8d;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .hint-btn {
            background-color: #ffc800;
            color: #1d1d1d;
            box-shadow: 0 4px 0 #d4a400;
        }
        .hint-btn:disabled {
            background-color: #3b4c56;
            box-shadow: none;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        .check-btn {
            background-color: #58cc02;
            color: white;
            box-shadow: 0 4px 0 #46a302;
        }
        .check-btn:disabled {
            background-color: #3b4c56;
            box-shadow: none;
            color: #7f8c8d;
            cursor: not-allowed;
        }
        .feedback {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
        }
        .correct { color: #58cc02; }
        .wrong { color: #ff4b4b; }
        .screen {
            display: none;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .restart-btn {
            background-color: #58cc02;
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 16px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #46a302;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- GAME SCREEN -->
<div id="game-screen" class="container screen active">
    <div class="header-status">
        <div class="hearts" id="hearts-display">❤️❤️❤️</div>
        <div class="status-right">
            <div class="streak-counter" id="streak-display">🔥 Streak: 0</div>
            <div class="streak-shop">
                <div class="shop-label">Streak Shop</div>
                <button class="shop-btn" id="shop-btn" onclick="buyGoldHeart()">Buy 💛 (Costs 3 🔥)</button>
            </div>
        </div>
    </div>
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div class="prompt" id="game-prompt">Select the correct Latvian spelling:</div>
    <div class="word-box" id="target-word">Hello</div>
    <div class="hard-badge" id="hard-badge">✨ Answering this question correctly awards 💛</div>

    <div class="options-container" id="options"></div>

    <div class="feedback" id="feedback"></div>

    <div class="footer-status">
        <div class="heart-progress" id="heart-progress">0/10 ❤️</div>
    </div>

    <div class="footer">
        <button class="btn hint-btn" id="hint-action" onclick="useHint()">HINT</button>
        <button class="btn skip-btn" id="skip-action" onclick="skipQuestion()">SKIP</button>
        <button class="btn check-btn" id="check-action" onclick="handleButtonClick()">CHECK</button>
    </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="game-over-screen" class="container screen">
    <h1 style="font-size: 48px; color: #ff4b4b;">Game Over</h1>
    <p style="font-size: 20px; color: #afafaf; margin-bottom: 30px;">Better luck next time &lt;3!</p>
    <button class="restart-btn" onclick="resetGame()">Try Again</button>
</div>

<!-- VICTORY SCREEN -->
<div id="victory-screen" class="container screen">
    <h1 style="font-size: 48px; color: #58cc02;">Lieliski!</h1>
    <p style="font-size: 20px; color: #afafaf; margin-bottom: 30px;">You completed the run successfully!</p>
    <button class="restart-btn" onclick="resetGame()">Play Again</button>
</div>

<script>
    // Jautājumu bāze ar taviem gramatikas āķiem
    const allQuestions = [
        { prompt: "Select the correct spelling for 'Hello':", target: "Hello", correct: "Sveiki", options: ["Sveķi", "Sveiki", "Sveikī"] },
        { prompt: "Select the correct spelling for 'Thank you':", target: "Thank you", correct: "Paldies", options: ["Paldis", "Paldies", "Paldīs"] },
        { prompt: "Select the correct spelling for 'Please':", target: "Please", correct: "Lūdzu", options: ["Lūdzu", "Ludzu", "Lūdzo"] },
        { prompt: "Select the correct spelling for 'I love you':", target: "I love you", correct: "Es tevi mīlu", options: ["Es tevi milu", "Es tavi mīlu", "Es tevi mīlu"] },
        { prompt: "Select the correct spelling for 'How are you?':", target: "How are you?", correct: "Kā tev iet?", options: ["Ka tev iet?", "Kā tev iet?", "Kā tēv iet?"] },
        { prompt: "Select the correct spelling for 'Apple':", target: "Apple", correct: "Ābols", options: ["Abols", "Ābols", "Ābuls"] },
        { prompt: "Select the correct spelling for 'Bread':", target: "Bread", correct: "Maize", options: ["Maize", "Maīze", "Meize"] },
        { prompt: "Select the correct spelling for 'Water':", target: "Water", correct: "Ūdens", options: ["Udens", "Ūdens", "Ūdins"] },
        { prompt: "Select the correct spelling for 'Good morning':", target: "Good morning", correct: "Labrīt", options: ["Labvakar", "Labdien", "Labrīt"] },
        { prompt: "Select the correct spelling for 'Goodbye':", target: "Goodbye", correct: "Uz redzēšanos", options: ["Uz neredzēšanos", "Uz redzēšanos", "Uz tikšanos"] },
        { prompt: "Select the correct spelling for 'How much does it cost?':", target: "How much does it cost?", correct: "Cik tas maksā?", options: ["Cik tas maksa?", "Cik tas maksā?", "Tikai man maksā?"] },
        { prompt: "Select the correct spelling for 'Excuse me / Sorry':", target: "Excuse me / Sorry", correct: "Atvainojiet", options: ["Atsūtiet", "Atvairiet", "Atvainojiet"] },
        { prompt: "Select the correct spelling for 'Where is the bathroom?':", target: "Where is the bathroom?", correct: "Kur ir tualete?", options: ["Kur ir tualete?", "Kur ir tualēte?", "Kūr īr tualete?"] },
        { prompt: "Select the correct spelling for 'Yes, please':", target: "Yes, please", correct: "Jā, lūdzu", options: ["Ja, ludzu", "Jā, lūdzu", "Jā, lūdzo"] },
        { prompt: "Select the correct spelling for 'I don't understand':", target: "I don't understand", correct: "Es nesaprotu", options: ["Es saprotu", "Es zināju", "Es nesaprotu"] },
        { prompt: "Select the correct spelling for 'Delicious!':", target: "Delicious!", correct: "Garšīgi!", options: ["Garšīgi!", "Negaršīgi!", "Kas var būt labāks par šo!", "Drausmīgi!"] },
        { prompt: "Select the correct spelling for 'Night':", target: "Night", correct: "Nakts", options: ["Rīts", "Nakts", "Diena"] },
        { prompt: "Select the correct spelling for 'Milk':", target: "Milk", correct: "Piens", options: ["Piens", "Ūdens", "Krējums"] },
        { prompt: "Select the correct spelling for 'School':", target: "School", correct: "Skola", options: ["Skola", "Skōla", "Skolaa"] },
        { prompt: "Select the correct spelling for 'I am tired':", target: "I am tired", correct: "Es esmu noguris", options: ["Es būšu noguris", "Es esmu noguris", "Es biju noguris"] },
        { prompt: "Select the correct spelling for 'We are friends':", target: "We are friends", correct: "Mēs esam draugi", options: ["Mēs esam draugi", "Mēs bijām draugi", "Mēs būsim draugi"] },
        { prompt: "Select the correct spelling for 'Family':", target: "Family", correct: "Ģimene", options: ["Gimene", "Ģimene", "Ģimenē"] },
        { prompt: "Select the correct spelling for 'Book':", target: "Book", correct: "Grāmata", options: ["Gramata", "Grāmata", "Gramāta"] },
        { prompt: "Fill in the blank with the correct word for 'I drink water':", target: "Es ___ ūdeni.", correct: "dzeru", options: ["dzeru", "dzer", "dzeram"] },
        { prompt: "Fill in the blank with the correct word for 'My name is...':", target: "Mans ___ ir...", correct: "vārds", options: ["vārds", "vārdi", "vardu"] },
        { prompt: "Fill in the blank with the correct word for 'I live in Latvia':", target: "Es dzīvoju ___.", correct: "Latvijā", options: ["Latvija", "Latvijā", "Latviju"] },
        { prompt: "Fill in the blank with the correct word for 'Today is warm':", target: "Šodien ir ___ laiks.", correct: "silts", options: ["silts", "silta", "silti"] },
        { prompt: "Fill in the blank with the correct word for 'I want coffee':", target: "Es gribu ___.", correct: "kafiju", options: ["kafija", "kafiju", "kafijas"] },
        { prompt: "Fill in the blank with the correct word for 'Where are you going?':", target: "Uz kurieni tu ___?", correct: "ej", options: ["ej", "eju", "iet"] },
        { prompt: "Fill in the blank with the correct word for 'This is my wife':", target: "Šī ir mana ___.", correct: "sieva", options: ["sieva", "sievu", "sievas"] },
        { prompt: "Choose the correct past tense form: 'Yesterday I went to the shop'", target: "Vakar es ___ uz veikalu.", correct: "gāju", options: ["gāju", "gāji", "iesu"], isHard: true },
        { prompt: "Choose the correct future tense form: 'Tomorrow we will celebrate'", target: "Rīt mēs ___ svētkus.", correct: "svinēsim", options: ["svinējām", "svinam", "svinēsim"], isHard: true },
        { prompt: "Select the correct locative form for 'in the kitchen':", target: "Mamma gatavo pusdienas ___.", correct: "virtuvē", options: ["virtuve", "virtuvē", "virtuvi"], isHard: true },
        { prompt: "Select the correct plural form for 'beautiful flowers':", target: "Dārzā zied ___ puķes.", correct: "skaistas", options: ["skaisti", "skaistas", "skaistus"], isHard: true }
    ];

    let questions = [];
    let currentQuestionIndex = 0;
    let selectedAnswer = null;
    let isAnswerChecked = false;
    let redHearts = 3;
    let goldHearts = 0;
    let currentStreak = 0;
    let totalCorrectAnswers = 0;
    let heartProgressCount = 0;
    let hasUsedHintForCurrentQuestion = false;
    let hintMessageTimeout = null;

    function initGame() {
        questions = [...allQuestions].sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0;
        redHearts = 3;
        goldHearts = 0;
        currentStreak = 0;
        totalCorrectAnswers = 0;
        heartProgressCount = 0;
        isAnswerChecked = false;
        selectedAnswer = null;
        hasUsedHintForCurrentQuestion = false;

        updateHeartProgressDisplay();
        updateStatusDisplay();
        showScreen('game-screen');
        loadQuestion();
    }

    function getTotalHearts() {
        return redHearts + goldHearts;
    }

    function canUseHint() {
        if (isAnswerChecked || hasUsedHintForCurrentQuestion) return false;
        if (goldHearts <= 0) return false;
        const totalHearts = getTotalHearts();
        if (totalHearts === 1 && goldHearts === 1) return false;
        return true;
    }

    function showTemporaryFeedback(message, type) {
        const feedbackDiv = document.getElementById('feedback');
        feedbackDiv.className = `feedback ${type}`;
        feedbackDiv.textContent = message;

        if (hintMessageTimeout) {
            clearTimeout(hintMessageTimeout);
        }

        hintMessageTimeout = setTimeout(() => {
            if (!isAnswerChecked) {
                feedbackDiv.textContent = '';
                feedbackDiv.className = 'feedback';
            }
        }, 1400);
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questions.length) {
            showScreen('victory-screen');
            return;
        }

        isAnswerChecked = false;
        selectedAnswer = null;
        hasUsedHintForCurrentQuestion = false;
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').textContent = '';
        document.getElementById('check-action').textContent = 'CHECK';
        document.getElementById('check-action').disabled = false;
        document.getElementById('skip-action').style.visibility = 'visible';
        document.getElementById('hint-action').disabled = !canUseHint();
        document.getElementById('skip-action').disabled = getTotalHearts() <= 1;

        const q = questions[currentQuestionIndex];
        document.getElementById('game-prompt').textContent = q.prompt;
        document.getElementById('target-word').textContent = q.target;

        const hardBadge = document.getElementById('hard-badge');
        hardBadge.style.display = q.isHard ? 'inline-flex' : 'none';

        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = '';

        q.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = `${index + 1}.   ${option}`;
            button.disabled = false;
            button.style.opacity = '1';
            button.style.textDecoration = 'none';
            button.onclick = () => {
                if (!isAnswerChecked) {
                    selectOption(button, option);
                }
            };
            optionsDiv.appendChild(button);
        });

        const progressPercent = (currentQuestionIndex / questions.length) * 100;
        document.getElementById('progress').style.width = `${progressPercent}%`;
    }

    function selectOption(button, option) {
        document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
        selectedAnswer = option;
    }

    function handleButtonClick() {
        if (!isAnswerChecked) {
            checkAnswer();
            return;
        }

        if (getTotalHearts() <= 0) {
            showScreen('game-over-screen');
            return;
        }

        currentQuestionIndex++;
        loadQuestion();
    }

    function useHint() {
        if (!canUseHint()) {
            showTemporaryFeedback('Yellow hearts cannot be used at this time', 'wrong');
            return;
        }

        const q = questions[currentQuestionIndex];
        const wrongOptions = q.options.filter(option => option !== q.correct);

        if (wrongOptions.length === 0) {
            showTemporaryFeedback('No hint available for this question.', 'wrong');
            return;
        }

        goldHearts--;
        hasUsedHintForCurrentQuestion = true;
        document.getElementById('hint-action').disabled = true;

        const buttons = Array.from(document.querySelectorAll('.option-btn'));
        const optionToRemove = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
        const targetButton = buttons.find((button) => button.textContent.replace(/^\d+\.\s*/, '') === optionToRemove);

        if (targetButton) {
            targetButton.disabled = true;
            targetButton.style.opacity = '0.35';
            targetButton.style.textDecoration = 'line-through';
        }

        updateStatusDisplay();
        showTemporaryFeedback('Hint used: one wrong option removed.', 'correct');
    }

    function checkAnswer() {
        const feedbackDiv = document.getElementById('feedback');
        if (!selectedAnswer) {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.textContent = 'Please select an option first!';
            return;
        }

        isAnswerChecked = true;
        document.getElementById('skip-action').style.visibility = 'hidden';
        document.getElementById('check-action').textContent = 'CONTINUE';
        document.getElementById('check-action').disabled = false;
        document.getElementById('hint-action').disabled = true;

        const q = questions[currentQuestionIndex];
        const answerButtons = document.querySelectorAll('.option-btn');

        answerButtons.forEach((button) => {
            button.disabled = true;
            if (button.textContent.replace(/^\d+\.\s*/, '') === q.correct) {
                button.classList.add('selected');
            }
        });

        if (selectedAnswer === q.correct) {
            feedbackDiv.className = 'feedback correct';
            heartProgressCount++;

            if (heartProgressCount >= 10) {
                heartProgressCount = 0;
                if (redHearts < 5) {
                    redHearts++;
                }
            }

            if (q.isHard) {
                if (goldHearts < 3) {
                    goldHearts++;
                }
                feedbackDiv.textContent = '✓ Correct solution! 💛 Gold heart earned!';
            } else {
                currentStreak++;
                totalCorrectAnswers++;
                feedbackDiv.textContent = '✓ Correct solution!';
            }
        } else {
            feedbackDiv.className = 'feedback wrong';
            feedbackDiv.textContent = `✕ Wrong. Correct answer was: ${q.correct}`;
            currentStreak = 0;

            if (redHearts > 0) {
                redHearts--;
            } else if (goldHearts > 0) {
                goldHearts--;
            }

            document.querySelectorAll('.option-btn').forEach((button) => {
                button.disabled = true;
            });

            document.getElementById('skip-action').disabled = true;
            document.getElementById('hint-action').disabled = true;
            document.getElementById('check-action').disabled = false;
        }

        updateHeartProgressDisplay();
        updateStatusDisplay();
    }

    function skipQuestion() {
        if (isAnswerChecked) {
            return;
        }

        if (getTotalHearts() <= 1) {
            showTemporaryFeedback('You cannot skip when you are down to your last heart!', 'wrong');
            document.getElementById('skip-action').disabled = true;
            return;
        }

        currentStreak = 0;

        if (redHearts > 0) {
            redHearts--;
        } else if (goldHearts > 0) {
            goldHearts--;
        }

        updateStatusDisplay();

        if (redHearts + goldHearts <= 0) {
            showScreen('game-over-screen');
            return;
        }

        currentQuestionIndex++;
        loadQuestion();
    }

    function buyGoldHeart() {
        if (currentStreak < 3 || goldHearts >= 3) {
            if (currentStreak < 3) {
                showTemporaryFeedback('Not enough streak points!', 'wrong');
            }
            return;
        }

        currentStreak -= 3;
        goldHearts++;
        updateStatusDisplay();
        showTemporaryFeedback('💛 Gold heart purchased!', 'correct');
    }

    function updateStatusDisplay() {
        const redText = '❤️'.repeat(Math.max(redHearts, 0));
        const goldText = '💛'.repeat(Math.max(goldHearts, 0));
        document.getElementById('hearts-display').textContent = redText + goldText;
        document.getElementById('skip-action').disabled = getTotalHearts() <= 1;
        document.getElementById('hint-action').disabled = !canUseHint();
        document.getElementById('shop-btn').disabled = currentStreak < 3 || goldHearts >= 3;
        document.getElementById('streak-display').textContent = `🔥 Streak: ${currentStreak}`;
    }

    function updateHeartProgressDisplay() {
        document.getElementById('heart-progress').textContent = `${heartProgressCount}/10 ❤️`;
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach((screen) => screen.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function resetGame() {
        initGame();
    }

    initGame();
</script>
</body>
</html>
